<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Price Q&A — 물어보는 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --panel:#efe9db; --border:#ddd4c2;
  --ink:#191714; --sub:#453f35; --muted:#6b6355; --light:#9a927f;
  --claret:#8c1d2f; --claret-lt:#a54b5e; --claret-dp:#6d1522;
  --gold:#a8863c; --gold-dp:#8a6d2e; --green:#1d6b45; --red:#b3261e; --slate:#33606d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:Inter,-apple-system,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.55;
 display:flex;flex-direction:column}
header{background:var(--card);border-bottom:2px solid var(--claret);padding:13px 20px;flex:none}
.hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.3px}
.meta{font-size:11.5px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--light);margin-right:5px}
.dot.on{background:var(--green)} .dot.off{background:var(--red)}

#feed{flex:1;overflow-y:auto;padding:20px}
.inner{max-width:1080px;margin:0 auto}

.intro{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.intro h2{margin:0 0 6px;font-size:15px;color:var(--claret-dp)}
.intro p{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:5px 12px;
 font-size:12px;cursor:pointer;transition:.13s;color:var(--sub)}
.chip:hover{background:var(--claret);color:#fff;border-color:var(--claret)}

.msg{margin-bottom:16px;display:flex;gap:10px}
.msg.me{justify-content:flex-end}
.bubble{max-width:88%;border-radius:12px;padding:11px 15px}
.me .bubble{background:var(--claret);color:#fff;border-bottom-right-radius:3px}
.bot .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:3px;width:100%}

.stage{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;padding:2px 0}
.spin{width:11px;height:11px;border:2px solid var(--border);border-top-color:var(--claret);
 border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

details.sql{margin:2px 0 10px;border:1px solid var(--border);border-radius:7px;background:#fbf7ee}
details.sql summary{cursor:pointer;padding:6px 11px;font-size:11.5px;color:var(--gold-dp);font-weight:600;
 user-select:none;list-style:none}
details.sql summary::-webkit-details-marker{display:none}
details.sql summary::before{content:'▸ ';}
details.sql[open] summary::before{content:'▾ ';}
details.sql pre{margin:0;padding:9px 12px;border-top:1px solid var(--border);overflow-x:auto;
 font-size:11.5px;line-height:1.55;color:var(--sub);white-space:pre-wrap;word-break:break-word}

.tblwrap{overflow-x:auto;margin:8px 0;border:1px solid var(--border);border-radius:7px;max-height:340px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--claret-dp);color:#fff;padding:6px 10px;text-align:left;font-weight:600;
 font-size:11px;white-space:nowrap;position:sticky;top:0}
td{padding:5px 10px;border-bottom:1px solid var(--panel);white-space:nowrap}
tr:nth-child(even) td{background:#f9f5ec}
td.num{text-align:right;font-variant-numeric:tabular-nums}

.answer{margin-top:4px}
.answer table{margin:9px 0;border:1px solid var(--border)}
.answer p{margin:0 0 8px}
.answer strong{color:var(--claret-dp)}
.rowinfo{font-size:11px;color:var(--light);margin-top:5px}
.routeline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.vtag{background:var(--green);color:#fff;border-radius:4px;padding:2px 8px;font-size:10.5px;font-weight:700}
.gtag{background:var(--gold);color:#fff;border-radius:4px;padding:2px 8px;font-size:10.5px;font-weight:700}
.rnote{font-size:11px;color:var(--muted)}
.err{background:#fbeceb;border-left:4px solid var(--red);padding:9px 13px;border-radius:5px;
 font-size:12.5px;color:var(--claret-dp)}

footer{flex:none;background:var(--card);border-top:1px solid var(--border);padding:12px 20px}
.fwrap{max-width:1080px;margin:0 auto;display:flex;gap:9px}
#q{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:9px;font-size:14px;
 font-family:inherit;background:#fff;color:var(--ink);resize:none;max-height:120px}
#q:focus{outline:none;border-color:var(--claret-lt)}
#send{padding:0 22px;border:none;border-radius:9px;background:var(--claret);color:#fff;
 font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
#send:hover{background:var(--claret-dp)}
#send:disabled{background:var(--light);cursor:not-allowed}
.hint{max-width:1080px;margin:7px auto 0;font-size:10.5px;color:var(--light)}
</style></head><body>

<header><div class="hwrap">
  <h1>Price Q&amp;A</h1>
  <span class="meta"><span class="dot" id="dot"></span><span id="status">서버 확인 중…</span></span>
  <span class="meta" style="margin-left:auto">11채널 · 31만 가격기록 · 물어보시면 DB를 조회해 답합니다</span>
</div></header>

<div id="feed"><div class="inner">
  <div class="intro">
    <h2>무엇이든 물어보십시오</h2>
    <p>한국어로 질문하시면 가격 DB를 직접 조회해 답합니다.
       <b>실행한 SQL과 원본 표를 항상 함께</b> 보여드리니 근거를 직접 확인하실 수 있습니다.</p>
    <div class="chips" id="chips"></div>
  </div>
</div></div>

<footer>
  <div class="fwrap">
    <textarea id="q" rows="1" placeholder="예) Tamkeen이랑 SWS에서 같은 LG 모델 가격 차이 큰 순서로 보여줘"></textarea>
    <button id="send">전송</button>
  </div>
  <div class="hint">Enter 전송 · Shift+Enter 줄바꿈 · 답변은 조회 결과에 근거하며, SQL을 펼쳐 검증하실 수 있습니다.</div>
</footer>

<script>
// 서버 주소 — start_price_qa.sh 가 터널 URL을 여기에 주입한다
const API = "https://sandy-varied-hotel-workflow.trycloudflare.com";

const feed=document.getElementById('feed'), inner=feed.querySelector('.inner');
const qEl=document.getElementById('q'), sendEl=document.getElementById('send');
const dot=document.getElementById('dot'), statusEl=document.getElementById('status');
let history=[], busy=false;

const SAMPLES=[
  "LG 프리미엄이 지난 6개월 어떻게 변했어?",
  "같은 LG 모델인데 채널별 가격 차이 큰 순서로",
  "지난 7일 경쟁사 중 가격 내린 곳",
  "eXtra에서 Gree가 제일 싼 18000 BTU 모델은?",
  "Tamkeen이 왜 이렇게 싸? 채널별 LG 평균가 보여줘",
  "8월에 새로 들어온 경쟁사 제품",
  "채널별 데이터 언제까지 수집됐어?"
];
const chips=document.getElementById('chips');
SAMPLES.forEach(s=>{const b=document.createElement('div');b.className='chip';b.textContent=s;
  b.onclick=()=>{qEl.value=s;ask();};chips.appendChild(b);});

fetch(API+'/health').then(r=>r.json()).then(d=>{
  dot.className='dot on'; statusEl.textContent='연결됨 · 기준일 '+d.anchor;
}).catch(()=>{ dot.className='dot off'; statusEl.textContent='서버에 연결할 수 없습니다'; });

qEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask();}
});
qEl.addEventListener('input',()=>{qEl.style.height='auto';qEl.style.height=Math.min(qEl.scrollHeight,120)+'px';});
sendEl.onclick=ask;

function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function bottom(){feed.scrollTop=feed.scrollHeight;}

function md(t){ // 최소 마크다운: 표 · 굵게 · 문단
  const lines=String(t).split('\n'); let out='',tbl=null;
  const flush=()=>{ if(tbl){ out+='<div class="tblwrap"><table>'+tbl+'</table></div>'; tbl=null; } };
  for(const ln of lines){
    if(/^\s*\|.*\|\s*$/.test(ln)){
      const cells=ln.trim().slice(1,-1).split('|').map(c=>c.trim());
      if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue;
      const tag = tbl===null ? 'th' : 'td';
      if(tbl===null) tbl='';
      tbl+='<tr>'+cells.map(c=>`<${tag}>${bold(esc(c))}</${tag}>`).join('')+'</tr>';
    } else { flush(); if(ln.trim()) out+='<p>'+bold(esc(ln))+'</p>'; }
  }
  flush(); return out;
}
function bold(s){return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}

function renderTable(cols,rows){
  if(!rows.length) return '<div class="rowinfo">조회 결과 0건</div>';
  const isNum=v=>typeof v==='number';
  let h='<div class="tblwrap"><table><tr>'+cols.map(c=>`<th>${esc(c)}</th>`).join('')+'</tr>';
  rows.slice(0,60).forEach(r=>{ h+='<tr>'+r.map(v=>
    `<td class="${isNum(v)?'num':''}">${v===null?'<span style="color:var(--light)">—</span>':esc(isNum(v)?v.toLocaleString():v)}</td>`
  ).join('')+'</tr>'; });
  return h+'</table></div>';
}

async function ask(){
  const q=qEl.value.trim(); if(!q||busy) return;
  busy=true; sendEl.disabled=true; qEl.value=''; qEl.style.height='auto';

  const me=document.createElement('div'); me.className='msg me';
  me.innerHTML=`<div class="bubble">${esc(q)}</div>`; inner.appendChild(me);

  const bot=document.createElement('div'); bot.className='msg bot';
  const bub=document.createElement('div'); bub.className='bubble';
  bub.innerHTML='<div class="stage"><span class="spin"></span><span>질문을 SQL로 옮기는 중…</span></div>';
  bot.appendChild(bub); inner.appendChild(bot); bottom();

  let sqlHtml='', tblHtml='', info='';
  const paint=(stage)=>{
    bub.innerHTML = sqlHtml + tblHtml + info +
      (stage?`<div class="stage"><span class="spin"></span><span>${esc(stage)}</span></div>`:'');
    bottom();
  };

  try{
    const res=await fetch(API+'/ask_stream',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q,history:history.slice(-4)})});
    const rd=res.body.getReader(), dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n'); buf=parts.pop();
      for(const p of parts){
        const line=p.split('\n').find(l=>l.startsWith('data: ')); if(!line) continue;
        const d=JSON.parse(line.slice(6));
        if(d.type==='stage') paint(d.text);
        else if(d.type==='sql'){
          const badge = d.route==='verified'
            ? `<span class="vtag">✓ 검증된 질의</span>`
            : `<span class="gtag">AI 생성 질의</span>`;
          sqlHtml=`<div class="routeline">${badge}${d.route==='verified'
              ? '<span class="rnote">자주 묻는 유형이라 손으로 검증한 고정 질의를 씁니다 — 같은 질문엔 항상 같은 답이 나옵니다.</span>'
              : '<span class="rnote">이 질문은 AI가 질의를 새로 지었습니다. 아래 SQL로 근거를 확인해 주십시오.</span>'}</div>`
            + `<details class="sql"><summary>실행한 SQL 보기 (근거)</summary><pre>${esc(d.sql)}</pre></details>`;
          paint('데이터 조회 중…');
        }
        else if(d.type==='rows'){
          tblHtml=renderTable(d.columns,d.rows);
          info=`<div class="rowinfo">${d.row_count}행${d.row_count>60?' (상위 60행 표시)':''} · 기준일 ${d.anchor}</div>`;
          paint('해석하는 중…');
        }
        else if(d.type==='answer'){
          bub.innerHTML = `<div class="answer">${md(d.answer)}</div>` + sqlHtml + tblHtml + info;
          history.push({role:'형님',text:q},{role:'참모',text:d.answer});
          bottom();
        }
        else if(d.type==='error'){
          bub.innerHTML = `<div class="err">${esc(d.message)}</div>` + (d.sql?`<details class="sql"><summary>시도한 SQL</summary><pre>${esc(d.sql)}</pre></details>`:'');
          bottom();
        }
      }
    }
  }catch(e){
    bub.innerHTML=`<div class="err">서버 연결 실패: ${esc(e.message)}<br>서버가 꺼져 있거나 터널 주소가 바뀌었을 수 있습니다.</div>`;
  }
  busy=false; sendEl.disabled=false; qEl.focus();
}
</script></body></html>
