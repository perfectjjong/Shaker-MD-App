 const last=a[a.length-1], prev=a[a.length-2]||last;

 [...sel].sort().forEach(c=>{const v=src[keys[keys.length-1]][c]||{};

 document.getElementById('t1').textContent=(view==='m'?'월별':'일별(8월)')+' P·S·I — 선택 카테고리 합계';
 document.getElementById('t2').textContent='재고(I) 구성 — 카테고리 적층 '+(view==='m'?'(월말)':'(일말)');
 if(ch1)ch1.destroy(); if(ch2)ch2.destroy();
 ch1=new Chart(document.getElementById('c1'),{type:'bar',
  data:{labels:keys,datasets:[
   {label:'P 입고',data:a.map(x=>x.P),backgroundColor:css('--sky')+'cc',order:2},
   {label:'S 출고',data:a.map(x=>x.S),backgroundColor:css('--primary')+'cc',order:2},
   {label:'I 재고',data:a.map(x=>x.I),type:'line',borderColor:css('--green'),backgroundColor:css('--green'),yAxisID:'y2',tension:.25,pointRadius:2,order:1}]},

   plugins:{legend:{labels:{boxWidth:12}}}}});
 ch2=new Chart(document.getElementById('c2'),{type:'bar',

 }
