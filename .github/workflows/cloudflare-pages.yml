name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pages project if not exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create shaker-dashboard --production-branch=main
        continue-on-error: true

      # workingDirectory=docs 필수: wrangler 는 Functions 를 '자신의 cwd 기준 ./functions'
      # 에서 찾는다. 리포 루트에서 돌리면 docs/functions 를 못 봐서 미들웨어가
      # 조용히 빠진 채 자산만 배포된다(= 접근 제어 전면 무력화).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: pages deploy . --project-name=shaker-dashboard --branch=main --commit-dirty=true

      - name: Verify Functions were deployed
        run: |
          # 배포 로그에 Functions 번들이 없으면 실패시킨다 — 조용히 빠지면 아무도 모른다
          cd docs
          npx wrangler@4 pages functions build --outfile=/tmp/_worker_check.js
          grep -q "api/cards" /tmp/_worker_check.js || { echo "::error::Functions 번들에 /api/cards 없음"; exit 1; }
          echo "Functions 번들 확인 완료"

